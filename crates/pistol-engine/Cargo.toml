[package]
name = "pistol-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The rules, the geometry and the position: the engine composes them and
# restates none of them (CLAUDE.md rule 2).
pistol-core = { workspace = true }
# The evaluation backends the config can name, and their weight tables.
pistol-eval = { workspace = true }
# The search this engine drives, and the types it reports with. The engine is
# the only place a `Budget` becomes a `Stop` (docs/decisions.md D-73).
pistol-search = { workspace = true }
pistol-solver = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
# Recovers the exact key path of a rejected field, so every config failure can
# name the key that caused it (docs/decisions.md D-24).
serde_path_to_error = { workspace = true }
