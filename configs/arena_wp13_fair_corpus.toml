# pistol — WP-1.3 Run 3b: first-player win rate on the realism cross-check book.
#
# A MEASUREMENT, NOT A TEST. There is no hypothesis to accept or reject here:
# the committed configuration plays itself over the whole realism cross-check book and the
# number this run exists for is one line of the report,
# `first_player_wins <k> of <n> decided`. The research report names fairness on
# 3 axes as untested and says to measure the first-player win rate directly
# (Caveats, and Deliverable 4's reporting fields); this is that measurement, and
# it is the number this corpus could not give on its own: the corpus's recorded
# first-player rate is confounded by which humans were playing, and this run
# replaces them with one engine playing both seats (docs/decisions.md D-145).
#
# WHAT A SELF-MATCH DOES TO THE SAMPLE, pre-registered so it is not read wrong
# afterwards: two identical deterministic engines play the same game from either
# seat, so both games of a pair are the same game, `distinct_n` is exactly half
# of `n`, every pair scores 1-1 and the verdict is `inconclusive_degenerate`
# (docs/decisions.md D-156). That is the CORRECT answer and not a failure. It
# also means the effective sample for the rate is the 1591 distinct games, not
# the 3182 played, and the interval quoted for it must be computed on 1591.
#
# THIS RUN AND RUN 3a DO NOT ESTIMATE THE SAME QUANTITY, and the two numbers are
# never averaged. Run 3a samples openings uniformly, so its rate is the first
# player's advantage from an arbitrary five-stone position. This book's openings
# are the ones humans actually reached, and D-145 measured them lopsided: across
# canonical classes with at least ten corpus games the human first-player rate
# runs 0.10 to 0.91, and 26 of 61 sit outside 0.35-0.65. So this rate is the
# first player's advantage CONDITIONED ON a human-reached opening, which is the
# realism cross-check it is here for and is not a fairness constant.
#
# A FORFEIT INVALIDATES THIS MEASUREMENT, and the number it invalidates still
# prints. `score::tally` counts any non-capped result as `decided`, and a forfeit
# is a decided result (D-158 keeps the result and the manner of it separate), so
# a run in which every game forfeited reports a first-player rate composed
# entirely of protocol failures on the very line this run exists to produce. The
# verdict token `invalid_forfeit` and the `forfeits` count are what say so, and
# they are on neighbouring lines rather than on that one. So: a run with any
# forfeit is not a measurement, is reported rather than discarded, and is re-run
# only after the forfeit's cause is found — the same rule Run 1 states.

# The `[sprt]` block below is therefore inert. It is present because the schema
# requires it and complete because CLAUDE.md rule 1 admits no absent key; no
# likelihood ratio is defined on this sample at all.
#
# Validate this file with tools/config_check.sh.

schema_version = 2

[run]
openings_file = "crates/pistol-cli/tests/fixtures/openings_v1.txt"
# The whole book: 1591 openings, 3182 games, 1591 distinct. Openings here are
# four turns rather than three, so every game starts one turn deeper than
# Run 3a's (docs/decisions.md D-143).
openings_take = 1591

# Openings skipped before taking: this run starts at the top of the book.
# The knob exists so a second run can draw a DISJOINT window of the SAME book
# (docs/decisions.md D-202).
openings_skip = 0
# As Run 1, and for the same reason: a capped game has no first-player winner
# and is excluded from the rate's denominator by the arena, so a cap that bound
# would silently shrink this measurement's sample.
turn_cap = 40
# Four. The clearance is WP-1.3's own RED-TEAM round, not D-174, which lists the
# concurrency surface under "NOT reached, and therefore not cleared": that round
# got byte-identical verdict blocks at 1, 2, 4 and 8 workers over the full
# 1591-opening book through a real early stop.
n_workers = 4
# Liveness only, never an adjudication (D-159). Two minutes against a worst
# single search of 5.1 s over the whole bench fixture at this budget.
hang_timeout_ms = 120000

[budget]
# Run 1's budget, unchanged, because the calibration probe measured the
# first-player rate MOVING WITH IT — 8 of 20 at 25 000 and at 50 000, 12 of 20
# at 100 000. A fairness number is therefore a property of the instrument and
# not of the game, and quoting one without its budget would be a claim nobody
# measured.
kind = "nodes"
value = 50000

[sprt]
# Inert; see the header. The values match Run 1's so that the two documents do
# not appear to disagree about a hypothesis neither of them tests here.
elo0 = 0.0
elo1 = 25.0
alpha = 0.05
beta = 0.05

[engine_a]
# The committed deployment-shaped configuration, both seats. The labels differ
# because the report has to tell two sides apart; the configurations do not.
label = "self_a"
binary = "target/release/pistol"
# WHICH BUILD. A path is not an identity: `target/release/pistol` is a
# different program after every build, and a run played by a binary nobody
# built is a different experiment reported under this one's name
# (docs/decisions.md D-147, D-252, D-283). The arena digests the file at the
# path above BEFORE it spawns anything and refuses a mismatch by name
# (`EngineBinaryDigestMismatch`), so this key must name the build being
# measured. Recorded at d6f6cbb on the development machine, from
#   cargo build --release --locked --bin pistol && sha256sum target/release/pistol
# with rustc 1.97.1. REBUILD MEANS RE-RECORD: the digest going stale is the
# refusal this binding exists to produce, not a defect in the document.
binary_sha256 = "a7f519fade1124780463293b86e27cbdd0732540a84aa75acaed4de4689f03ce"
config = "configs/instrument_v0.toml"

[engine_b]
label = "self_b"
binary = "target/release/pistol"
binary_sha256 = "a7f519fade1124780463293b86e27cbdd0732540a84aa75acaed4de4689f03ce"
config = "configs/instrument_v0.toml"
