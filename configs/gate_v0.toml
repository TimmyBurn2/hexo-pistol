# pistol — the configuration the Stage-0 CI gates run.
#
# NOT a deployment config. That is configs/instrument_v0.toml, whose candidate
# radius of 3 is the one every strength claim is made at. This document exists
# because two gates have to finish in a CI run, and at radius 3 they cannot.
#
# The numbers, measured on the development machine in a release build, one core,
# from an eleven-stone midgame position (docs/decisions.md D-81 measured the same
# shape from the opening):
#
#             depth_turns 2   depth_turns 3   depth_turns 4   nodes 200000
#   radius 1        27 ms         365 ms          2.2 s          2.5 s
#   radius 2       252 ms         9.7 s        > 100 s             —
#   radius 3       1.30 s          84 s        hours (est)         4.8 s
#
# The determinism gate runs the whole sha-pinned fixture set twice per budget in
# two processes, and a forced-win case needs a completed depth 3 to see the win
# (a mate-in-two-of-its-own-turns scores mate 3 — every turn from the root
# counts, docs/decisions.md D-72). At radius 3 that is 84-100 s per position,
# which is minutes per case and hours per gate; at radius 1 it is under a second.
# That is the measured structural floor of a full-width Stage-0 search with no
# quiescence and no threat generation, recorded as a finding rather than treated
# as a failure (CLAUDE.md rule 5), and it is exactly the argument for Stage 1's
# threat-first candidate generation (docs/ROADMAP.md).
#
# What this config is therefore for: the determinism law (CLAUDE.md rule 4),
# which is about whether two runs agree and not about how strong they are, and
# the deep tactical cases of the fixture, which state this config by name so that
# nobody can mistake a radius-1 result for a deployment claim. The shallow
# tactical cases state configs/instrument_v0.toml instead and run at the radius
# that ships.
#
# Validate this file with tools/config_check.sh.

# Schema version this document is written against.
schema_version = 1

[engine]
# Reproducible measurement, single-threaded, stable tie-breaking. A gate that ran
# in play mode would be certifying something no strength claim uses.
mode = "instrument"

[search]
# 16 MiB. Small on purpose: two of these run at once during the cross-process
# determinism gate, the fixture positions are small, and a table that fits in
# cache keeps the gate about the search rather than about the memory subsystem.
# Must be a power of two and at least 1 MiB — the table indexes by masking and
# will not silently round.
tt_bytes = 16777216

# See the measurement table above. This is a gate knob, not a rule: the rules'
# radius-8 legal region lives in pistol-core and is never compared with it
# (docs/decisions.md D-20).
[search.candidate_policy]
kind = "radius"
radius = 1

[eval]
# The same backend and the same committed weight table the deployment config
# reads. The eval is the one thing this document does NOT narrow — the radius
# above and the table size are both smaller than the deployment config's, and
# both change which move comes back on a tie (docs/decisions.md D-109). That is
# why nothing measured here is a strength claim.
backend = "handcrafted_v0"
weights_file = "configs/eval_v0_weights.toml"

[instrument]
# Must be 1 while mode = "instrument": the determinism law admits no thread race
# on a move-choice path.
threads = 1
# Equal-scoring moves are ordered by coordinate, which is stable across runs,
# machines and builds.
tie_break = "lexicographic"
