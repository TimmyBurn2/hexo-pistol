# pistol — play-mode configuration, threat-first staged pair generation.
#
# The movetime measurement's seat (U3_tier_t.md §10; docs/ROADMAP.md WP-1.4).
# The staged counterpart of configs/play_v0.toml: same schema, same tt_bytes,
# same eval, and — unlike the instrument pair, which moved from radius 2 to
# staged on this WP's own SPRT — the incumbent this document's own movetime
# comparison is taken against is `configs/play_v0.toml` at radius 3.
#
# THE CUT BINDS HERE, for the same reason `configs/instrument_staged_v0.toml`
# binds it: a seat with the quiet cut disabled would make the movetime
# measurement say nothing about the prune it exists to characterise (CLAUDE.md
# rule 6, U2_node_protocol.md §7.2).
#
# Every strength claim in this project still comes from instrument mode; a
# result obtained here carries no number anyone may quote (CLAUDE.md rule 6).
#
# Validate this file with tools/config_check.sh.

schema_version = 3

[engine]
mode = "play"

[search]
tt_bytes = 268435456

[search.candidate_policy]
kind = "staged"
# Matches configs/play_v0.toml's radius 3, so the fallback ball and the
# safety net (docs/decisions.md D-353) reach the same cells the deployment
# radius policy does in the one place they still agree by construction.
quiet_radius = 3
quiet_top_k = 16
widen_schedule = [32]
# The safety-net cap (docs/decisions.md D-478, D-482): cells of the quiet ball a
# safety-net row may emit, at every node but the root turn's. 0 disables it, and
# 0 is the committed value everywhere until an SPRT says otherwise.
safety_net_top_k = 0
tier_t_own_count = 2
tier_t_opponent_count = 3
q_depth_turns = 0
q_triggers = "defensive_only"
# WP-1.7 ordering-heuristic gates (docs/experiments/wp17_design.md §6):
# default OFF in every committed config until an SPRT says otherwise.
killers = false
history = false
countermove = false

[eval]
backend = "handcrafted_v0"
weights_file = "configs/eval_v0_weights.toml"

[instrument]
threads = 1
tie_break = "lexicographic"

[play]
movetime_epsilon_ms = 50

[solver]
# WP-1.8b (design docs/experiments/wp18b_design.md §5): the solver on the
# search path, gate OFF in every committed config until an SPRT says
# otherwise. The knobs mirror configs/solver_v0.toml's committed values.
on_search_path = false
per_call_node_cap = 16384
trigger = "any_open_four"
epsilon_num = 1
epsilon_den = 4
zone_orders = 3
free_stone_radius = 8
tt_entries = 1048576
attacker_policy = "one_free_stone"
