# pistol — WP-1.8c rule-5 bench seat, gate OFF (the same seat, gate down).
#
# The bench of docs/experiments/wp18c_design.md §6 compares ONE binary in two
# seats: this pair differs in `[solver] on_search_path` and in nothing else, so
# the ratio it produces is the gate's cost and not a configuration difference.
# Both files are complete and schema-validated like every other config
# (CLAUDE.md rule 1); validate them with tools/config_check.sh.
#
# THE CAP IS 2048, the value §4b registers. It is not the determinism seat's
# 512 (sized for CI wall, D-441) and not the 16384 twelve gate-off configs
# carry inertly: §4b derives it from the deployment turn — at the MEASURED
# in-search cost of ~102 microseconds per solver visit, two capped calls at
# 2048 are about what a 0.5 s turn can absorb.
#
# NOT an SPRT arm and never a committed engine config: the committed configs
# keep `on_search_path = false` (D-441), and what this pair measures is
# whether an ON seat could become a candidate at all.

schema_version = 3

[engine]
mode = "instrument"

[search]
tt_bytes = 268435456

[search.candidate_policy]
kind = "staged"
quiet_radius = 2
quiet_top_k = 16
widen_schedule = [32]
# The safety-net cap (docs/decisions.md D-478, D-482): cells of the quiet ball a
# safety-net row may emit, at every node but the root turn's. 0 disables it, and
# 0 is the committed value everywhere until an SPRT says otherwise.
safety_net_top_k = 0
tier_t_own_count = 2
tier_t_opponent_count = 3
q_depth_turns = 0
q_triggers = "defensive_only"
killers = false
history = false
countermove = false

[solver]
on_search_path = false
per_call_node_cap = 2048
trigger = "any_open_four"
epsilon_num = 1
epsilon_den = 4
zone_orders = 3
free_stone_radius = 8
tt_entries = 1048576
attacker_policy = "one_free_stone"

[eval]
backend = "handcrafted_v0"
weights_file = "configs/eval_v0_weights.toml"

[instrument]
threads = 1
tie_break = "lexicographic"

[play]
movetime_epsilon_ms = 50
