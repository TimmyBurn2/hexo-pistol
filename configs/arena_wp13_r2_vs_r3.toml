# pistol — WP-1.3 Run 1: candidate radius 2 against candidate radius 3.
#
# THE PRE-REGISTERED EXPERIMENT. Every number below was fixed before the first
# game was played and none of them may move afterwards; the reasoning, the
# calibration probe they came from, and the outcome handling are in
# docs/experiments/wp13_prereg.md, pre-registered at eb6ea93 and recorded as
# docs/decisions.md D-186. Editing this file after a run has started does not
# adjust the experiment, it ends it.
#
# WHICH SIDE IS `engine_a` IS LOAD-BEARING AND IS NOT THE RUNBOOK'S LETTERING.
# The arena's statistic is engine A's score: `score::game_sample` builds the
# sample from `wins_a / capped / losses_a`, so `elo1 > 0` states the hypothesis
# "A is stronger than B" and nothing else. The pre-registered direction is
# H1 = "radius 2 is stronger than radius 3", so the radius-2 configuration must
# sit in `engine_a`. Putting it in `engine_b` and reading the sign backwards
# afterwards is the one mistake a pre-registration exists to prevent.
#
#
# HISTORICAL AS OF docs/decisions.md D-194. `engine_b` names
# configs/instrument_v0.toml, whose candidate radius moved from 3 to 2 when this
# experiment's own H1 action fired, so RE-RUNNING THIS DOCUMENT TODAY WOULD BE A
# SELF-MATCH between two radius-2 configurations and would report
# `inconclusive_degenerate`, not the experiment it describes. Nothing here has
# been adjusted — only this note added — because the values are the experiment.
# To reproduce the run, check out the revision it ran at; the report's
# `experiment_sha256` and its per-engine `config_sha256` lines are what verify a
# reproduction, never the paths (docs/decisions.md D-161).
#
# Validate this file with tools/config_check.sh.

# The ARENA's schema version, unrelated to the engine configs' (D-15..D-17).
schema_version = 2

[run]
# The primary SPRT book (docs/decisions.md D-175), verified against its own
# in-band body digest before a game is played (D-148, D-183). NOT
# openings_v1.txt: that one is the realism cross-check suite and is played in
# Run 3, where it is a measurement rather than a judge.
openings_file = "crates/pistol-cli/tests/fixtures/random_openings_v1.txt"

# The WHOLE book, which is also this run's game cap: every opening is exactly
# one pair, so the cap is twice this and is derived rather than stated again
# (docs/decisions.md D-157).
#
# 2000 AND NOT 500, because the cap IS the design's error rates and 500 could
# not deliver the ones the `[sprt]` block declares. The LLR needs 569 pairs to
# reach a boundary on drift alone at these bounds; a 500-pair book ran out
# first, achieving a measured power of 0.569 against a declared beta of 0.05.
# The book was extended to 2000 openings for this reason and the committed 500
# are its first 500 lines byte for byte (docs/decisions.md D-187). At this cap
# the same bounds achieve alpha 0.049 and power 0.945, with 0.7% inconclusive.
#
# It is not four times the compute: the sequential test stops when it has an
# answer, so the EXPECTED run is about 520 pairs either way and the cap binds
# only on the runs that need it.
#
# The run's resolution at the cap: `ci95` is
# 1.96 / (NELO_TO_T * sqrt(2) * sqrt(pairs)), a function of the pair count
# alone, so +/-10.8 normalized Elo at 2000 pairs against +/-21.5 at 500.
openings_take = 2000

# Openings skipped before taking: this run starts at the top of the book.
# The knob exists so a second run can draw a DISJOINT window of the SAME book
# (docs/decisions.md D-202).
openings_skip = 0

# An evaluation horizon, never a game rule (game rule 6, D-157). Pre-registered
# rather than left to taste because capped games are not inert in the statistic:
# a mass point at a half shrinks sigma and accelerates the LLR (D-157). 40 is
# three times the longest game the calibration probe saw at this budget (13
# turns, over 60 games at three budgets, none capped), so it is expected to bind
# on nothing; `capped_fraction` is reported and will say whether it did.
turn_cap = 40

# Four, and the clearance is WP-1.3's own RED-TEAM round rather than D-174.
# D-174 does not say four workers is cleared — it lists the concurrency surface
# under "NOT reached, and therefore not cleared" and predicts that WP-1.3's
# first full-book run would motivate the pass that clears it. It did: that round
# ran the full 1591-opening book with two different engines through a real early
# stop and got byte-identical verdict blocks at 1, 2, 4 and 8 workers, which is
# D-161's invariance claim tested at this experiment's worker count and scale.
# Nothing in this repository had run the arena above two workers before it.
n_workers = 4

# Liveness only: it can end a run and it can never produce a game result
# (D-159). Two minutes against a worst single search of 5.1 s over the whole
# 24-position bench fixture at this budget, single-threaded — roughly
# twenty-four times the worst observed turn, which is the margin four contending
# workers and a late-game position are allowed to want. The earlier basis for
# this key said 2.9 s and forty times; that was the worst of an eight-position
# probe, not of the fixture, and the number it justified is unchanged.
# Liveness only, never an adjudication (D-159). Two minutes against a worst
# single search of 5.1 s over the whole bench fixture at this budget.
hang_timeout_ms = 120000

[budget]
# Fixed nodes, per the research report's recommendation 5 — candidate-policy
# variants are benchmarked with a fixed-node SPRT — and because a movetime
# budget is refused by name (D-74, D-95).
#
# 50 000, from the calibration probe recorded in the pre-registration: 4.9 s per
# game and 2.4 s per side, which is the runbook's single-digit-seconds-per-side
# criterion with room, and a second deepening iteration completes in some games
# rather than none (25 000 completes one iteration and no more; 100 000 costs
# 48 s per game). The probe is not part of the sample.
#
# What node-matching does and does not buy is stated here rather than assumed,
# and it was measured across the whole bench fixture at THIS budget rather than
# reasoned about. The cap binds identically on both arms in 22 of 24 positions;
# radius 3 exceeds it in 2 (104 448 and 54 272 nodes against a 50 176 cap)
# because the first deepening iteration is not interruptible by design (D-74),
# and radius 2 exceeds it in none. So the arms are node-matched almost
# everywhere, and where they are not the overshoot favours radius 3.
#
# What the same nodes BUY differs sharply, and that is the mechanism under test
# rather than a confound: radius 3 completes a second turn-iteration in 6 of the
# 24 positions and radius 2 in 17. A depth-1 iteration searches the mover's own
# turn only, so in most positions radius 3 chooses without seeing a reply. The
# per-side `compute` lines report nodes and searches; the per-game `depth_a` and
# `depth_b` fields carry the depth distribution, because the run-level `deepest`
# is a maximum and would hide it.
kind = "nodes"
value = 50000

[sprt]
# Normalized Elo, alpha = beta = 0.05 per the research report's Deliverable 4.
#
# elo1 = 25 DEVIATES from that deliverable's suggested 3-5, deliberately: at 3-5
# no sample this project can draw resolves anything — inside even a 2000-pair
# book an elo1 of 5 reaches neither boundary at any truth, measured.
#
# THE DERIVATION THAT FIRST PRODUCED 25 WAS WRONG AND IS CORRECTED HERE. It read
# the report's `games ~= 640000/elo1^2` as a power formula; it is not one. That
# expression sizes the sample at which the LLR's EXPECTED value first reaches a
# boundary — the run has crossed roughly half the time there — so solving it at
# the book size chose a design with about 50% power by construction. Measured at
# 500 pairs: power 0.569 against a declared beta of 0.05.
#
# 25 survives the correction; the CAP is what had to move. The honest statement
# of this design, simulated on this crate's own `Sample`/`crossing` over 40 000
# runs per truth at a 0.5 decisive-pair fraction:
#
#            truth      P(H1)   P(H0)   P(inconclusive)   mean pairs
#            0 nElo     0.049   0.944       0.007             521
#          +25 nElo     0.945   0.048       0.007             520
#          -25 nElo     0.049   0.945       0.006             518
#          +50 nElo     1.000   0.000       0.000             191
#
# so alpha and beta are delivered at this cap rather than merely declared.
elo0 = 0.0
elo1 = 25.0
alpha = 0.05
beta = 0.05

[engine_a]
# THE DEFENDANT. In slot A because the statistic is slot A's score; see the
# header. `label` is what the report calls it, and it is not the slot.
label = "r2"
binary = "target/release/pistol"
# WHICH BUILD. A path is not an identity: `target/release/pistol` is a
# different program after every build, and a run played by a binary nobody
# built is a different experiment reported under this one's name
# (docs/decisions.md D-147, D-252, D-283). The arena digests the file at the
# path above BEFORE it spawns anything and refuses a mismatch by name
# (`EngineBinaryDigestMismatch`), so this key must name the build being
# measured. Recorded at d6f6cbb on the development machine, from
#   cargo build --release --locked --bin pistol && sha256sum target/release/pistol
# with rustc 1.97.1. REBUILD MEANS RE-RECORD: the digest going stale is the
# refusal this binding exists to produce, not a defect in the document.
binary_sha256 = "a7f519fade1124780463293b86e27cbdd0732540a84aa75acaed4de4689f03ce"
config = "configs/instrument_r2_v0.toml"

[engine_b]
# THE INCUMBENT, and the tie-winner by the pre-registered outcome rule: H0 and
# either inconclusive verdict all leave this configuration committed.
label = "r3"
binary = "target/release/pistol"
binary_sha256 = "a7f519fade1124780463293b86e27cbdd0732540a84aa75acaed4de4689f03ce"
config = "configs/instrument_v0.toml"
