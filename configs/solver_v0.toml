# pistol — solver v0 configuration (WP-1.8a).
#
# The single source of the solver's tunables (CLAUDE.md rule 1): every key
# required, none defaulted in code, validated by pistol-solver's own schema
# (SolverSection::validate). The registered starts, per
# docs/experiments/wp18a_design.md §8: epsilon 1/4 and zone_orders 3 are
# square-board paper imports (Pawlewicz-Lew CG 2006; Wu & Lin TCIAIG 2010)
# marked ESTIMATED and non-transferable; free_stone_radius 8 is the full
# legal region, the no-prune value the design's §3 argues for; tt_entries
# is an engineering start, unmeasured until the gates first run.

schema_version = 1

[solver]
epsilon_num = 1
epsilon_den = 4
zone_orders = 3
free_stone_radius = 8
tt_entries = 1048576
