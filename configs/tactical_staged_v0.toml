# pistol — instrument-mode configuration, staged, quiet cut DISABLED.
#
# THE TACTICAL SUITE UNDER STAGED gate's config (U3_tier_t.md §10;
# U4_soundness_instrument.md §8.3, docs/decisions.md D-316): what runs the
# fifteen `instrument_v0` tactical cases of `tactical_staged_v0.txt` under
# `CandidatePolicy::Staged`. NEW relative to the radius-only fixture family —
# this document did not exist before WP-1.5b, and its whole reason for
# existing is that `configs/instrument_staged_v0.toml` cannot be both the
# tactical config (cut disabled, so a `require 20` derivation holds) and the
# SPRT seat (cut enabled, or the match measures nothing about the prune).
#
# THE CUT IS DISABLED, AND NOT BY A VALUE IN THIS FILE (docs/decisions.md
# D-675). `quiet_top_k` was set above the whole candidate pool a fifteen-stone
# position's radius-2 ball can ever hold (MEASURED, the radius-2 ball's largest
# regime mean over the pinned census is under 400 —
# `crates/pistol-solver/tests/wp15b_census.rs`), but no code path read the key,
# so the cut was unarmed whatever it said. The tactical suite's `require 20`
# derivation (U4_soundness_instrument.md §8.3) needed "no legitimate cell is
# ever cut" and still has it, from the code rather than from a number here.
#
# Validate this file with tools/config_check.sh.

schema_version = 3

[engine]
mode = "instrument"

[search]
tt_bytes = 268435456

[search.candidate_policy]
kind = "staged"
quiet_radius = 2
# The safety-net cap (docs/decisions.md D-478, D-482): cells of the quiet ball a
# safety-net row may emit, at every node but the root turn's. 0 disables it, and
# 0 is the committed value everywhere until an SPRT says otherwise.
safety_net_top_k = 0
# The Tier-T width cap (W1): cells of Tier T's own union a BATCHED row may emit,
# at every node but the root turn's. 0 disables it, and 0 is the committed value
# in every document until an SPRT says otherwise. Distinct from
# safety_net_top_k above, which caps the quiet ball that stands in when Tier T
# is empty — the two sets have medians of 12 and 76 over the governed book.
tier_t_top_k = 0
# Re-sort the ROOT's candidates by the previous iteration's scores (W2, the one
# ordering mechanism the opponent study found sealbot has and this engine does
# not). false is the committed value until an SPRT says otherwise.
root_reorder = false
# The aspiration window's half-width in evaluation units (S1): each iteration
# after the first opens (previous - delta, previous + delta) and re-searches at
# full width if the score falls outside. 0 opens every iteration full width and
# is the committed value until an SPRT says otherwise.
aspiration_delta = 0
# One-cell forced-reply extensions a single line may grant (S2): a FILTERED row
# whose cover is one cell is singular by construction, so extending it a whole
# turn costs branching 1. 0 grants none and is the committed value.
extension_budget = 0
# LATE MOVE REDUCTIONS (S3). Least depth in TURNS a child must still have for a
# candidate deep in a BATCHED row's unforced range to be scanned one turn
# shallower; any such scan that beats alpha is re-searched at full depth before
# it may change a move. 0 arms no reduction and is the committed value.
lmr_min_depth_turns = 0
# Candidates of the unforced range scanned at full depth before reductions
# begin. Read only when lmr_min_depth_turns is non-zero.
lmr_late_index = 3
tier_t_own_count = 2
tier_t_opponent_count = 3
q_depth_turns = 0
q_triggers = "defensive_only"
# WP-1.7 ordering-heuristic gates (docs/experiments/wp17_design.md §6):
# default OFF in every committed config until an SPRT says otherwise.
killers = false
history = false
countermove = false

[eval]
backend = "handcrafted_v0"
weights_file = "configs/eval_v0_weights.toml"

[instrument]
threads = 1
tie_break = "lexicographic"

[play]
movetime_epsilon_ms = 50

[solver]
# WP-1.8b (design docs/experiments/wp18b_design.md §5): the solver on the
# search path, gate OFF in every committed config until an SPRT says
# otherwise. The knobs mirror configs/solver_v0.toml's committed values.
on_search_path = false
per_call_node_cap = 16384
trigger = "any_open_four"
epsilon_num = 1
epsilon_den = 4
zone_orders = 3
free_stone_radius = 8
tt_entries = 1048576
attacker_policy = "one_free_stone"
