# pistol — instrument-mode configuration.
#
# Complete by rule (CLAUDE.md rule 1): every key the schema names is present
# here, because no key has a code-side default and a missing key is an error.
# Unknown keys are rejected too, so a typo fails loudly instead of doing
# nothing.
#
# Every value below is settled and operator-confirmed. Validate this file with
# tools/config_check.sh.

# Schema version this document is written against. The build refuses a version
# it does not read, rather than guessing at the difference.
schema_version = 1

[engine]
# "instrument" — single-threaded, fixed budget, stable tie-breaking, CPU
# evaluation. Every strength claim in this project comes from this mode.
# The alternative is "play".
mode = "instrument"

[search]
# Transposition table size in bytes: 256 MiB. Must be a power of two and at
# least 1 MiB — the table indexes by masking and will not silently round.
tt_bytes = 268435456

# Which cells the search will consider. This is a search knob, not a rule: the
# rules' radius-8 legal region lives in pistol-core and is a different number
# that this one is never compared against.
#
# radius = 2, MEASURED. This line used to argue the opposite — that a length-6
# window reaches up to five cells from a stone, so correct extensions and blocks
# sit at distance 3 to 5, and that radius 2 therefore "risks tactical
# blindness". WP-1.3 Run 1 refuted that at a fixed-node instrument and the old
# argument is withdrawn rather than left standing beside a number that beat it
# (docs/decisions.md D-190, D-194).
#
# The evidence: radius 2 in slot A against radius 3, fixed nodes 50 000, paired
# openings, verdict `h1` at 37 pairs with `nelo_pair +210.87`, confirmed on the
# disjoint corpus book at 50 pairs with `+155.38` — 126 wins of 174 games across
# two books. The mechanism was measured before those games were played: at this
# budget radius 2 completes a second turn-iteration in 17 of 24 bench positions
# where radius 3 manages 6, and a depth-1 iteration searches the mover's own turn
# without ever seeing a reply. The narrower set buys depth, and depth wins.
#
# WHAT THIS NUMBER DOES NOT SAY, because the distinction decides what may be
# quoted from it: the win is NODE-matched, not time-matched. Radius 2 spent 1.90x
# the wall-clock for 6.1% FEWER nodes, so at an equal-TIME budget it would get
# about half the nodes it had here and nothing measured says its depth advantage
# survives that. configs/play_v0.toml therefore stays at radius 3 and the two
# configs deliberately disagree for the first time; WP-1.4 owns the movetime path
# and the time-matched SPRT that would reunite them.
#
# Still a search knob and never the rules' radius-8 legal region, which is a
# pinned constant in pistol-core and is never compared with this number
# (CLAUDE.md rule 2, docs/decisions.md D-20). The radius policy itself remains a
# Stage-0 placeholder that Stage 1's threat-first staged candidate generator
# supersedes (docs/ROADMAP.md WP-1.5).
[search.candidate_policy]
kind = "radius"
radius = 2

[eval]
# Handcrafted three-axis line-window pattern tables.
backend = "handcrafted_v0"
# The v0 weight table is committed configuration, not an artifact: it is a
# handful of integers an operator can read and edit (docs/decisions.md D-11).
# The Stage-2 codebook net is the artifact, and that is never committed. This
# file is written in WP-05; whether it exists is checked when pistol-eval opens
# it, not when this document is parsed (docs/decisions.md D-21).
weights_file = "configs/eval_v0_weights.toml"

[instrument]
# Must be 1 while mode = "instrument": the determinism law admits no thread
# race on a move-choice path.
threads = 1
# Equal-scoring moves are ordered by coordinate, which is stable across runs,
# machines and builds.
tie_break = "lexicographic"
