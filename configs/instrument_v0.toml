# pistol — instrument-mode configuration.
#
# Complete by rule (CLAUDE.md rule 1): every key the schema names is present
# here, because no key has a code-side default and a missing key is an error.
# Unknown keys are rejected too, so a typo fails loudly instead of doing
# nothing.
#
# Every value below is settled and operator-confirmed. Validate this file with
# tools/config_check.sh.

# Schema version this document is written against. The build refuses a version
# it does not read, rather than guessing at the difference.
schema_version = 2

[engine]
# "instrument" — single-threaded, fixed budget, stable tie-breaking, CPU
# evaluation. Every strength claim in this project comes from this mode.
# The alternative is "play".
mode = "instrument"

[search]
# Transposition table size in bytes: 256 MiB. Must be a power of two and at
# least 1 MiB — the table indexes by masking and will not silently round.
tt_bytes = 268435456

# Which cells the search will consider. This is a search knob, not a rule: the
# rules' radius-8 legal region lives in pistol-core and is a different number
# that this one is never compared against.
#
# STAGED, MEASURED. This block used to commit `kind = "radius", radius = 2`,
# argued by WP-1.3 Run 1 (D-190, D-194). WP-1.5b's SPRT refutes THAT number in
# turn and the argument for it is withdrawn rather than left standing beside a
# policy that beat it (docs/decisions.md D-381, D-385, D-386) — the same
# discipline D-194 itself used against radius 3.
#
# THE EVIDENCE, two disjoint books, both node-matched at 50 000, both
# attributable and robust under Criterion 1' (docs/decisions.md D-384):
# primary book, `verdict h1` at 58 pairs, `nelo_pair +1854.80`; confirmatory
# book (`openings_v1.txt`), `verdict h1` at 51 pairs, `nelo_pair +1737.18` —
# 202 wins of 218 decided games across both books, staged never worse than a
# 101-1 split in either sample. Both crossings are below the pre-registered
# 100-pair floor individually; §5 of the prereg names the confirmatory-run
# procedure for exactly this case, D-190's own instrument, and both intervals
# are read as optimistic per that same procedure — recorded here rather than
# overstated.
#
# WHAT THIS NUMBER DOES NOT SAY, the same distinction D-194 drew and this
# config inherits unchanged: the win is NODE-matched, not time-matched.
# `configs/play_v0.toml` THEREFORE STAYS AT radius 3 (D-194's own value,
# untouched) — WP-1.5b's SPRT says nothing about a movetime-matched budget,
# and moving play_v0.toml on the strength of a node-matched run would be
# exactly the extrapolation D-194 already declined to make for radius 2.
# `configs/play_staged_v0.toml` already exists as the seat a future
# movetime-matched SPRT would validate; this run does not license moving to
# it.
#
# Still a search knob and never the rules' radius-8 legal region, which is a
# pinned constant in pistol-core and is never compared with this number
# (CLAUDE.md rule 2, docs/decisions.md D-20). `configs/instrument_r2_v0.toml`
# is kept, unchanged, as D-194's own historical pin of the radius-2 committed
# value — completed run reports (D-190's own) name it by path and pin it by
# digest, so it is not deleted merely because a newer policy has superseded
# it (the same reasoning D-194 gave for keeping it in the first place).
[search.candidate_policy]
kind = "staged"
quiet_radius = 2
quiet_top_k = 16
widen_schedule = [32]
tier_t_own_count = 2
tier_t_opponent_count = 3
q_depth_turns = 0
q_triggers = "defensive_only"
# WP-1.7 ordering-heuristic gates (docs/experiments/wp17_design.md §6):
# default OFF in every committed config until an SPRT says otherwise.
killers = false
history = false
countermove = false

[eval]
# Handcrafted three-axis line-window pattern tables.
backend = "handcrafted_v0"
# The v0 weight table is committed configuration, not an artifact: it is a
# handful of integers an operator can read and edit (docs/decisions.md D-11).
# The Stage-2 codebook net is the artifact, and that is never committed. This
# file is written in WP-05; whether it exists is checked when pistol-eval opens
# it, not when this document is parsed (docs/decisions.md D-21).
weights_file = "configs/eval_v0_weights.toml"

[instrument]
# Must be 1 while mode = "instrument": the determinism law admits no thread
# race on a move-choice path.
threads = 1
# Equal-scoring moves are ordered by coordinate, which is stable across runs,
# machines and builds.
tie_break = "lexicographic"

[play]
# Stated even though the mode is "instrument": a config is complete, and every
# key is present because no key has a code-side default (CLAUDE.md rule 1).
# This key binds only in play mode — the movetime ceiling's overshoot allowance
# in milliseconds, promised as `go movetime N` answering within N + epsilon and
# advertised on the play-mode handshake (docs/decisions.md, WP-1.4 series).
movetime_epsilon_ms = 50
