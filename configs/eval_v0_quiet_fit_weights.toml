# WP-2.2 Phase 1 — the quiet-term fit candidate. Committed configuration and
# not an artifact: a handful of integers an operator can read and edit
# (docs/decisions.md D-11), which is what the committed table says of itself.
#
# Produced from the sweep corpus under the row filter of
# docs/experiments/wp22_phase1_design.md. Entries 4 and 5 are carried VERBATIM
# from configs/eval_v0_weights.toml (R6, docs/decisions.md D-622): the filtered
# rows carry no evidence about them at all.
#
# AND NEITHER DO THEY CARRY ANY ABOUT THE EXCHANGE RATES between the quiet block
# and those two. So entry 3 and the quiet SUM are both held at their committed
# values as well, which leaves the corpus exactly one degree of freedom — the
# split of that sum between entries 1 and 2 — and it moves it from 2:12 to 4:10.
# That is D-627's replacement principle applied fully rather than stopped at the
# first pin (docs/experiments/matrix_wp22_quiet_scale.md section 5).

schema_version = 1
backend = "handcrafted_v0"

[table]
1 = 4
2 = 10
3 = 60
4 = 300
5 = 1500
