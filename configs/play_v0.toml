# pistol — play-mode configuration.
#
# The deployment counterpart of configs/instrument_v0.toml: the same search, told
# that it may be asked for a move under a wall-clock budget. That is the whole
# difference, and it is the reason this document exists — CLAUDE.md's design point
# is a strong move within 0.5 s, which is a `movetime` budget, and instrument mode
# refuses one by name because a wall-clock result cannot be reproduced
# (docs/decisions.md D-22).
#
# Every strength claim in this project still comes from instrument mode. This mode
# is for playing, not for measuring: a result obtained here carries no number
# anyone may quote (CLAUDE.md rule 6).
#
# Validate this file with tools/config_check.sh.

# Schema version this document is written against.
schema_version = 3

[engine]
# "play" — all three budget kinds are accepted, including movetime.
#
# ACCEPTED, and since WP-1.4 a CEILING: `go movetime N` answers within
# N + play.movetime_epsilon_ms. Before deepening the search secures a bounded
# fallback answer (an instant-win check, then the first candidates of the
# deterministic ordering), so every iteration — the first included — may be
# interrupted, and a completed root candidate of the interrupted iteration is
# salvaged when one exists. D-95's floor (1.9 s / 8.6 s / 58.6 s returns against
# a 500 ms budget) is superseded; the measured overshoot table and the promise's
# domain live beside the mechanism decision in docs/decisions.md. A driver that
# wants a strength number must use instrument mode anyway (CLAUDE.md rule 6).
mode = "play"

[search]
# 256 MiB, as in the instrument config: the table is the search's memory of the
# game, and a deployment has no reason to hold less of it than a measurement does.
# Must be a power of two and at least 1 MiB.
tt_bytes = 268435456

# radius 3, and this is the FIRST TIME this file deliberately disagrees with
# configs/instrument_v0.toml, which moved to radius 2 on WP-1.3 Run 1's evidence
# (docs/decisions.md D-190, D-194). The invariant this comment used to state —
# play and measurement search the same way, or a measurement says nothing about
# play — is suspended here on purpose, and the reason is the shape of the
# evidence rather than a doubt about it.
#
# Run 1 is a NODE-matched result: at 50 000 nodes radius 2 beat radius 3 by
# +210.87 normalized Elo, while spending 1.90x the wall-clock for 6.1% fewer
# nodes. This mode's budget is the clock, not the node count (CLAUDE.md's design
# point is a 0.5 s move), so at equal TIME radius 2 would get roughly half the
# nodes it had in that experiment, and nothing measured says its depth advantage
# survives the halving. Moving this file on that evidence would be exactly the
# extrapolation D-190 declined to make.
#
# What reunites them: the time-matched r2-vs-r3 SPRT at 500 ms, which WP-1.4's
# movetime ceiling has now made runnable and LICENSED but which has not run —
# the operator pre-registers and runs it per the WP-1.3 runbook pattern, and it
# decides this file's radius. Until that verdict this value does not move.
[search.candidate_policy]
kind = "radius"
radius = 3

[eval]
backend = "handcrafted_v0"
weights_file = "configs/eval_v0_weights.toml"

[instrument]
# Stated even though the mode is "play": a config is complete, and every key is
# present because no key has a code-side default (CLAUDE.md rule 1). This build
# searches single-threaded in every mode and refuses any other number by name;
# Lazy SMP arrives in Stage 4 (docs/ROADMAP.md).
threads = 1
tie_break = "lexicographic"

[play]
# The movetime ceiling's overshoot allowance, in milliseconds: `go movetime N`
# answers within N + this value. It covers the bounded uninterruptible sections
# (the fallback stage, one node's candidate-generation and ordering tail, the
# unwind and report I/O); the internal deadline stays at N. Advertised on the
# play-mode handshake. Its measured domain — machine, build, stone-count
# envelope — is recorded beside the mechanism decision in docs/decisions.md;
# raising this value to green a failing movetime gate is a post-hoc threshold
# move CLAUDE.md forbids.
movetime_epsilon_ms = 50

[solver]
# WP-1.8b (design docs/experiments/wp18b_design.md §5): the solver on the
# search path, gate OFF in every committed config until an SPRT says
# otherwise. The knobs mirror configs/solver_v0.toml's committed values.
on_search_path = false
per_call_node_cap = 16384
trigger = "any_open_four"
epsilon_num = 1
epsilon_den = 4
zone_orders = 3
free_stone_radius = 8
tt_entries = 1048576
attacker_policy = "one_free_stone"
