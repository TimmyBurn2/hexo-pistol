# pistol — WP-1.7's DRY RUN. Not an experiment, and it decides nothing.
#
# This document exists to satisfy CLAUDE.md's dry-run rule for
# docs/experiments/wp17_sprt_prereg.md: a pre-registration's literal commands
# are exercised before its review passes, on an input of the SAME KIND as the
# registered workload — the same sort of artefact, differing only in identity
# — and never on the registered workload itself.
#
# IT IS A REAL INSTANCE OF THE KIND: the heuristics-ON staged seat against
# the committed plain staged seat, played through the real arena over a real
# sha-pinned book. It is not the registered workload — it differs in
# identity on the axis the registered run's sample is defined by:
#
#   - BOOK: openings_v1.txt, the realism cross-check corpus, and NOT the
#     primary SPRT book random_openings_v1.txt the governed run draws its
#     fresh slice from. The registered workload is 500 openings of
#     random_openings_v1 at skip 1000; four openings of a different book are
#     a different sample of the same kind, and nothing is consumed.
#   - SIZE: four openings, eight games.
#
# The MATCHUP is the registered one (all three heuristics ON against the
# committed OFF) rather than a wider arm, because WP-1.7 has no wider arm to
# reach for: the three gates are one claim, and the dry run's job is to
# exercise the commands and the attribution chain, not to sample strength.
#
# WHAT IS DELIBERATELY THE SAME, because a dry run that changes everything
# exercises nothing: the budget, the turn cap, the worker count and the hang
# timeout are the governed run's, so the commands are exercised against the
# shapes they will meet.
#
# THE VERDICT THIS PRODUCES IS NOT A RESULT. Four openings cannot cross an
# SPRT boundary at these bounds and are not meant to; what the dry run reads
# is the Criterion 1'' chain (tools/wp16_warm_attribution_check.py over an
# `arena --replay` pass, unchanged from WP-1.6) plus the second instrument,
# which are about ATTRIBUTION and not about strength. Nothing in this file
# may be quoted as a measurement of either engine.
#
# Validate this file with tools/config_check.sh.

schema_version = 2

[run]
openings_file = "crates/pistol-cli/tests/fixtures/openings_v1.txt"
openings_take = 4
openings_skip = 0
turn_cap = 40
n_workers = 4
hang_timeout_ms = 120000

[budget]
kind = "nodes"
value = 50000

[sprt]
# The governed run's bounds (unchanged from WP-1.6, per this WP's dispatch).
# Nothing is concluded from the LLR either way; the block is present so the
# report's instrument lines are the real ones.
elo0 = 0.0
elo1 = 15.0
alpha = 0.05
beta = 0.05

[engine_a]
label = "staged_h"
binary = "target/release/pistol"
# Recorded from cargo build --release --locked --bin pistol &&
# sha256sum target/release/pistol at this file's own revision. REBUILD MEANS
# RE-RECORD.
binary_sha256 = "665d2815ddba28e7889ebea661a10b15352036ab46bfc6f1758d72813cad4184"
config = "configs/instrument_staged_h_v0.toml"

[engine_b]
label = "staged"
binary = "target/release/pistol"
binary_sha256 = "665d2815ddba28e7889ebea661a10b15352036ab46bfc6f1758d72813cad4184"
config = "configs/instrument_staged_v0.toml"
