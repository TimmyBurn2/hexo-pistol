[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
publish = false

# One version of every shared dependency, chosen here and inherited by member
# crates. pistol-core takes nothing from this table: it is std-only by contract —
# it appears here as something other crates depend *on*, never the other way.
[workspace.dependencies]
pistol-core = { path = "crates/pistol-core" }
pistol-eval = { path = "crates/pistol-eval" }
pistol-solver = { path = "crates/pistol-solver" }
pistol-search = { path = "crates/pistol-search" }
pistol-engine = { path = "crates/pistol-engine" }
pistol-cli = { path = "crates/pistol-cli" }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
serde_path_to_error = "0.1.20"

# Still deliberately no codegen tuning here — that is what D-14 defers, and it
# stays deferred until there is a bench to judge it by (CLAUDE.md rule 5). What
# these two profiles set is not codegen: it is which checks a build keeps.
#
# `overflow-checks` in release because a wrapped coordinate or a wrapped turn
# count is a wrong answer this engine would go on to play, and a rule-3 fail-loud
# project does not ship the one class of error the compiler will silently absorb
# (docs/decisions.md D-127). Its measured cost is in that line.
#
# `release-checked` is the profile red-team and deep verification runs build:
# release speed plus `debug_assert!`, so a diagnostic whose cost is unwanted on
# the deployment hot path is live where it is being looked for, without anyone
# hand-editing an assertion's class to go looking (D-128, D-129).
[profile.release]
overflow-checks = true

[profile.release-checked]
inherits = "release"
debug-assertions = true

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "deny"
